[project]
name = "problemfinder"
version = "0.1.0"
description = "Local research tool: normalise public complaint and forum data into ranked problem themes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "typer>=0.15",
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "polars>=1.17",
    "fastexcel>=0.12",
    "uvicorn>=0.32",
    "pypdf>=6.14.2",
    "apscheduler>=3.11.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The zero-ML guarantee: the core app installs and runs without any of these.
# CI runs `uv sync` with no extras and the full suite passes; install locally
# with `uv sync --extra ml` to enable `pf ml cluster`.
ml = [
    "sentence-transformers>=3.3",
    "scikit-learn>=1.6",
]

[project.scripts]
pf = "problemfinder.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "respx>=0.22",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/problemfinder"]

# --- quality gates -------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID",
    "C90",           # cyclomatic complexity ceiling
    "PL",            # pylint: argument/branch/statement ceilings
    "ANN",           # type annotations required everywhere
]
ignore = [
    "PLR2004",       # magic-value comparisons; test assertions use literals
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# Function-level imports ARE the ml extras boundary: heavyweight packages load
# lazily so the core install imports every module without them.
"src/problemfinder/enrichment/ml/*" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# APScheduler 3.x ships no py.typed marker; its call sites here are thin and
# covered by tests/worker, so untyped imports are accepted for this module only.
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The ml extras group is absent in the zero-ML CI environment, so mypy must
# not require these packages to exist. sklearn ships no py.typed marker
# anyway; numpy's real stubs still apply wherever the extras are installed.
module = [
    "sentence_transformers", "sentence_transformers.*",
    "sklearn", "sklearn.*",
    "numpy", "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: requires the docker-compose Postgres (run `make up` first)",
]

# --- layering contract ----------------------------------------------------------
# Dependencies point inwards only. See CLAUDE.md for the prose version.

[tool.importlinter]
root_package = "problemfinder"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "problemfinder.cli | problemfinder.worker",
    "problemfinder.api",
    "problemfinder.queries | problemfinder.ingestion | problemfinder.enrichment",
    "problemfinder.sources | problemfinder.persistence",
    "problemfinder.domain",
]

# The enrichment runner orchestrates persistence (like ingestion does), but the
# rules themselves stay pure over domain models: no storage, no fetch, no SQL.
# The layers row above already makes ingestion and enrichment mutually
# independent, so raw ingestion can never depend on derived attributes.
[[tool.importlinter.contracts]]
name = "Enrichment rules are pure over domain models"
type = "forbidden"
source_modules = [
    "problemfinder.enrichment.passes",
    "problemfinder.enrichment.protocol",
    "problemfinder.enrichment.taxonomy",
    "problemfinder.enrichment.ruleset",
    "problemfinder.enrichment.derive",
    "problemfinder.enrichment.ml.embeddings",
    "problemfinder.enrichment.ml.cluster",
    "problemfinder.enrichment.ml.terms",
    "problemfinder.enrichment.ml.match",
]
forbidden_modules = [
    "problemfinder.persistence", "problemfinder.sources", "problemfinder.settings",
    "sqlalchemy",
]

# The zero-ML guarantee, mechanically: no module outside enrichment.ml may
# import an ML library directly (indirect chains through enrichment.ml are
# the design). That the imports inside enrichment.ml stay lazy is enforced
# at runtime by tests/enrichment/test_zero_ml_core.py and by CI installing
# no extras.
[[tool.importlinter.contracts]]
name = "ML libraries stay inside enrichment.ml"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "problemfinder.domain", "problemfinder.persistence", "problemfinder.sources",
    "problemfinder.ingestion", "problemfinder.queries", "problemfinder.api",
    "problemfinder.cli", "problemfinder.worker",
    "problemfinder.enrichment.passes", "problemfinder.enrichment.protocol",
    "problemfinder.enrichment.taxonomy", "problemfinder.enrichment.ruleset",
    "problemfinder.enrichment.derive", "problemfinder.enrichment.run",
]
forbidden_modules = ["sentence_transformers", "sklearn", "torch", "numpy"]

[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = ["problemfinder.domain"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "alembic", "httpx", "typer",
    "polars", "selectolax", "playwright", "apscheduler",
    "problemfinder.settings",
]

[[tool.importlinter.contracts]]
name = "Source adapters are independent of each other"
type = "independence"
modules = ["problemfinder.sources.adapters.*"]

[[tool.importlinter.contracts]]
name = "Fetch and parse libraries stay behind the adapter interface"
type = "forbidden"
source_modules = [
    "problemfinder.domain", "problemfinder.persistence", "problemfinder.enrichment",
    "problemfinder.ingestion", "problemfinder.queries", "problemfinder.api",
]
forbidden_modules = ["httpx", "selectolax", "playwright", "pypdf"]
