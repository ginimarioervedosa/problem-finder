# One entry per source. Adding a data source means one new adapter package
# under sources/adapters/ plus one entry here; nothing else changes.
#
# `schedule` is a cron expression consumed by `pf serve worker`. An optional
# `options` table per source is passed verbatim to that source's adapter;
# the core never interprets it.

[sources.fos_complaints]
enabled = true
schedule = "0 7 * * 1"

[sources.fos_decisions]
enabled = true
schedule = "0 7 * * 2"

[sources.fos_decisions.options]
window_from = 2025-01-01
window_to = 2025-06-30

# Annual reports appear once a year; a weekly check is plenty.
[sources.adjudicators_office]
enabled = true
schedule = "0 7 * * 3"

# Written evidence to select committee inquiries via the official
# committees API. Default committee 158 is the Treasury Committee; add ids
# to widen. window_from bounds the first backfill.
[sources.committee_evidence]
enabled = true
schedule = "0 8 * * 5"

[sources.committee_evidence.options]
committee_ids = [158]
window_from = 2025-01-01

# The decision-data CSV is re-uploaded cumulatively every few months.
[sources.leo_decisions]
enabled = true
schedule = "0 7 * * 4"

# Releases land twice a year (spring and autumn); a weekly check is plenty.
# Owner accepted the residual terms risk 2026-07-27 (see the adapter's policy).
[sources.fca_complaints_returns]
enabled = true
schedule = "0 7 * * 4"

# Official reviews feed, declared official_api by owner decision 2026-07-27
# (robots status recorded DISALLOWED in the adapter's policy). The app list
# is a starting proposal of UK finance apps high earners use; edit freely.
[sources.app_store_reviews]
enabled = true
schedule = "30 8 * * *"

[sources.app_store_reviews.options]
country = "gb"

[sources.app_store_reviews.options.apps]
1052238659 = "Monzo"
932493382 = "Revolut"
956806430 = "Starling Bank"
1517121245 = "Chase UK"
450465506 = "Hargreaves Lansdown"
434714838 = "interactive investor"
1127250193 = "Nutmeg"
1049797239 = "Moneybox"
566325832 = "Trading 212"

# Disabled until OAuth credentials exist in .env (PF_REDDIT_CLIENT_ID /
# PF_REDDIT_CLIENT_SECRET). The subreddit list is a starting proposal; edit freely.
[sources.reddit]
enabled = false
schedule = "0 8 * * *"

[sources.reddit.options]
subreddits = ["HENRYUK", "UKPersonalFinance", "FIREUK", "fatFIRE"]
max_pages = 10
