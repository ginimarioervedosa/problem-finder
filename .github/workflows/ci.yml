name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pf
          POSTGRES_PASSWORD: pf
          POSTGRES_DB: problemfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pf -d problemfinder"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      PF_DATABASE_URL: postgresql+psycopg://pf:pf@localhost:5432/problemfinder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # No --extra ml, deliberately: the zero-ML guarantee is that the core
      # install passes the entire gate set. ML-dependent tests skip visibly.
      - run: uv sync
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy src tests
        working-directory: backend
      - run: uv run lint-imports
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: python3 scripts/check_file_length.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint src tests
        working-directory: frontend
      - run: npm run -s test -- --run
        working-directory: frontend
      - run: node_modules/.bin/jscpd --config ../.jscpd.json
        working-directory: frontend

  type-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync
        working-directory: backend
      - run: uv run python ../scripts/export_openapi.py
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - name: fail on uncommitted type drift
        run: git diff --exit-code backend/openapi.json frontend/src/api/schema.d.ts
